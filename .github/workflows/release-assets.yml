name: release-assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach files to
        required: true
        default: v1.0.0
      files:
        description: Space-separated paths to attach
        required: true
        default: training/base-training.jsonl

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FILES: ${{ inputs.files }}
        run: |
          set -eu
          gh release view "$TAG" >/dev/null
          for file in $FILES; do
            echo "attaching $file to $TAG"
            gh release upload "$TAG" "$file" --clobber
          done
